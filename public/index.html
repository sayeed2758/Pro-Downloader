<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Downloader | Ultimate Media Resolver</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6254C9; }
        body { background-color: #F9FAFB; font-family: 'Inter', sans-serif; }
        .active-nav { color: var(--primary); }
        .pill-shadow { box-shadow: 0 4px 14px 0 rgba(98, 84, 201, 0.39); }
    </style>
</head>
<body class="pb-20">

    <!-- Header -->
    <header class="bg-white px-4 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-[#6254C9] rounded-lg flex items-center justify-center text-white">
                <i class="fa-solid fa-download text-sm"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-900">Pro Downloader</h1>
        </div>
        <div class="flex gap-4 items-center">
            <button id="premiumBtn" class="text-yellow-500 text-xl"><i class="fa-solid fa-crown"></i></button>
            <button id="settingsBtn" class="text-gray-500 text-xl"><i class="fa-solid fa-cog"></i></button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-view" class="p-4 max-w-md mx-auto">
        <!-- Views will be injected here (Phase 2) -->
        <div class="flex flex-col items-center justify-center h-[60vh] text-center">
            <div class="animate-pulse flex flex-col items-center">
                <div class="w-16 h-16 bg-gray-200 rounded-full mb-4"></div>
                <div class="h-4 w-48 bg-gray-200 rounded mb-2"></div>
                <div class="h-3 w-32 bg-gray-200 rounded"></div>
            </div>
            <p class="mt-8 text-gray-400 font-medium">Initialising Pro Architecture...</p>
        </div>
    </main>

    <!-- Fixed Bottom Navigation (Section 8 Requirement) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-2 py-2 flex justify-around items-center z-50">
        <button class="nav-item flex flex-col items-center gap-1 active-nav">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-medium">Home</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1 text-gray-400">
            <i class="fa-solid fa-circle-down text-lg"></i>
            <span class="text-[10px] font-medium">Downloader</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1 text-gray-400">
            <i class="fa-solid fa-clock-rotate-left text-lg"></i>
            <span class="text-[10px] font-medium">History</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1 text-gray-400">
            <i class="fa-solid fa-play text-lg"></i>
            <span class="text-[10px] font-medium">Videos</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1 text-gray-400">
            <i class="fa-solid fa-layer-group text-lg"></i>
            <span class="text-[10px] font-medium">Tabs</span>
        </button>
    </nav>

    <!-- Watermark (Section 50 Requirement) -->
    <div class="text-center py-4 text-xs text-gray-400">
        Made With ♥ By Shahid
    </div>

</body>
</html>
